name: Release — Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v2.1.0)'
        required: true
        default: 'v0.0.0-test'

jobs:
  # ─── Windows: .exe installer (nsis) + portable ───────────────────────────────
  build-windows:
    name: Build Windows (x64 + ia32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Meson & Ninja
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Remove Strawberry Perl GCC from PATH
        shell: pwsh
        run: |
          $paths = $env:PATH -split ';' | Where-Object { $_ -notmatch 'Strawberry' }
          "PATH=$($paths -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_DOWNLOAD_MODELS: "1"
        run: npm ci

      - name: Build renderer + electron
        run: |
          npm run build
          npm run build:electron

      - name: Force abseil-cpp 20250127.0 (fixes missing unscaledcycleclock.cc on MSVC)
        shell: pwsh
        run: |
          # abseil-cpp 20240722.0 ships without unscaledcycleclock.cc in its tarball,
          # causing a fatal C1083 error when compiled with MSVC cl.exe.
          # 20250127.0 includes the file. We patch the .wrap before cargo compiles
          # webrtc-audio-processing-sys so Meson fetches the correct version.

          # Run cargo fetch so the crate registry is populated
          Set-Location native-module
          cargo fetch

          # Find the wrap file inside the cargo registry cache
          $wrap = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" `
            -Recurse -Filter "abseil-cpp.wrap" -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $wrap) {
            Write-Error "abseil-cpp.wrap not found in cargo registry"
            exit 1
          }
          Write-Host "Patching: $($wrap.FullName)"

          # Write the corrected wrap file — 20250127.0 has the correct hash and
          # includes unscaledcycleclock.cc which is missing from 20240722.0
          $newContent = @'
          [wrap-file]
          directory = abseil-cpp-20250127.0
          source_url = https://github.com/abseil/abseil-cpp/releases/download/20250127.0/abseil-cpp-20250127.0.tar.gz
          source_filename = abseil-cpp-20250127.0.tar.gz
          source_hash = 40a5949f1af5b6a4be580952fd3d5a5d87fbc0c37b9dfbcfa51114c54e91e98f
          patch_url = https://wrapdb.mesonbuild.com/v2/abseil-cpp_20250127.0-1/get_patch
          patch_hash = a9c1e98898ac1a2b8f53b7fdb12ee5c7b5f08a02c451abd42e1a69c5bbffde5c

          [provide]
          absl_base = absl_base_dep
          absl_flags = absl_flags_dep
          absl_strings = absl_strings_dep
          absl_numeric = absl_numeric_dep
          absl_synchronization = absl_synchronization_dep
          absl_bad_optional_access = absl_bad_optional_access_dep
          '@
          # Write without BOM, Unix line endings — Meson is sensitive to encoding
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($wrap.FullName, $newContent, $utf8NoBom)
          Write-Host "Patched to abseil-cpp 20250127.0"
          Write-Host "--- wrap file content ---"
          Get-Content $wrap.FullName

      - name: Build native module (Windows)
        run: npm run build:native

      - name: Package with electron-builder (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: release/*.exe
          if-no-files-found: error
