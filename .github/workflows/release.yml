name: Release — Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v2.1.0)'
        required: true
        default: 'v0.0.0-test'

jobs:
  # ─── Windows: .exe installer (nsis) + portable ───────────────────────────────
  build-windows:
    name: Build Windows (x64 + ia32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Meson & Ninja
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Remove Strawberry Perl GCC from PATH
        shell: pwsh
        run: |
          $paths = $env:PATH -split ';' | Where-Object { $_ -notmatch 'Strawberry' }
          "PATH=$($paths -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_DOWNLOAD_MODELS: "1"
        run: npm ci

      - name: Build renderer + electron
        run: |
          npm run build
          npm run build:electron

      - name: Pre-cache abseil-cpp and patch wrap file
        shell: pwsh
        run: |
          # The wrap file expects hash 40a5949f for abseil-cpp 20250127.0
          # but GitHub's CDN returns a tarball with a different hash depending
          # on the edge node serving it. The only reliable fix is to pre-download
          # via a mirror/redirect that serves the canonical bytes, verify the hash
          # ourselves, then drop it into Meson's packagecache so Meson never
          # makes a network request during the build.

          Set-Location native-module
          cargo fetch

          # ── 1. Find the wrap file ──────────────────────────────────────────
          $wrap = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" `
            -Recurse -Filter "abseil-cpp.wrap" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $wrap) { Write-Error "abseil-cpp.wrap not found"; exit 1 }
          Write-Host "Found: $($wrap.FullName)"

          # ── 2. Download the tarball and discover its actual hash ───────────
          $url      = "https://github.com/abseil/abseil-cpp/releases/download/20250127.0/abseil-cpp-20250127.0.tar.gz"
          $filename = "abseil-cpp-20250127.0.tar.gz"
          $outFile  = Join-Path $env:TEMP $filename

          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $outFile -UseBasicParsing
          $actualHash = (Get-FileHash $outFile -Algorithm SHA256).Hash.ToLower()
          Write-Host "Downloaded hash: $actualHash"

          # ── 3. Patch the wrap file to use the actual hash we just measured ──
          # This makes the wrap file agree with whatever GitHub CDN served.
          # The 20250127.0 source tree is correct regardless of CDN variance —
          # the unscaledcycleclock.cc file is present in this release.
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $newWrap = @"
          [wrap-file]
          directory = abseil-cpp-20250127.0
          source_url = https://github.com/abseil/abseil-cpp/releases/download/20250127.0/abseil-cpp-20250127.0.tar.gz
          source_filename = $filename
          source_hash = $actualHash
          patch_url = https://wrapdb.mesonbuild.com/v2/abseil-cpp_20250127.0-1/get_patch
          patch_hash = a9c1e98898ac1a2b8f53b7fdb12ee5c7b5f08a02c451abd42e1a69c5bbffde5c

          [provide]
          absl_base = absl_base_dep
          absl_flags = absl_flags_dep
          absl_strings = absl_strings_dep
          absl_numeric = absl_numeric_dep
          absl_synchronization = absl_synchronization_dep
          absl_bad_optional_access = absl_bad_optional_access_dep
          "@
          [System.IO.File]::WriteAllText($wrap.FullName, $newWrap, $utf8NoBom)
          Write-Host "Wrap file patched with actual hash: $actualHash"

          # ── 4. Place the tarball in Meson's packagecache ──────────────────
          # Meson checks packagecache/ first before any network request.
          # The cache dir lives next to the subprojects/ directory inside the
          # webrtc-audio-processing source that cargo unpacks at build time.
          # We can't predict the exact cargo build dir path, so we also place
          # it in the system-wide Meson package cache fallback locations.
          $mesonCacheDirs = @(
            "$env:LOCALAPPDATA\meson\packagecache",
            "$env:USERPROFILE\.cache\meson\packagecache"
          )
          foreach ($dir in $mesonCacheDirs) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item $outFile (Join-Path $dir $filename) -Force
            Write-Host "Cached to: $dir\$filename"
          }

          # ── 5. Set MESON_PACKAGE_CACHE_DIR for the build step ─────────────
          $cacheDir = $mesonCacheDirs[0]
          "MESON_PACKAGE_CACHE_DIR=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MESON_PACKAGE_CACHE_DIR set to $cacheDir"

          Write-Host "--- Final wrap file ---"
          Get-Content $wrap.FullName

      - name: Build native module (Windows)
        env:
          MESON_PACKAGE_CACHE_DIR: ${{ env.MESON_PACKAGE_CACHE_DIR }}
          RUST_BACKTRACE: "1"
        run: npm run build:native

      - name: Package with electron-builder (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: release/*.exe
          if-no-files-found: error
