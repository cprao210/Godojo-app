name: Release — Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v2.1.0)'
        required: true
        default: 'v0.0.0-test'

jobs:
  # ─── macOS: .dmg + .zip for x64 and arm64 ───────────────────────────────────
  build-macos:
    name: Build macOS (x64 + arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # build-native.js uses rustup + napi-rs to compile the native Rust module
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Meson & Ninja
        run: brew install meson ninja

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_DOWNLOAD_MODELS: "1"
        run: npm ci

      - name: Build renderer + electron
        run: |
          npm run build
          npm run build:electron

      - name: Build native Rust module (x64 + arm64)
        # NATIVELY_BUILD_ALL_MAC_ARCHES=1 tells build-native.js to compile both arches
        env:
          NATIVELY_BUILD_ALL_MAC_ARCHES: "1"
        run: npm run build:native

      - name: Package with electron-builder (macOS)
        # ad-hoc-sign.js runs automatically as afterPack hook via package.json
        # identity: null in package.json = unsigned, no CSC secrets needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  # ─── Windows: .exe installer (nsis) + portable ───────────────────────────────
  build-windows:
    name: Build Windows (x64 + ia32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Meson & Ninja
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Remove Strawberry Perl GCC from PATH
        shell: pwsh
        run: |
          $paths = $env:PATH -split ';' | Where-Object { $_ -notmatch 'Strawberry' }
          "PATH=$($paths -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_DOWNLOAD_MODELS: "1"
        run: npm ci

      - name: Build renderer + electron
        run: |
          npm run build
          npm run build:electron

      - name: Vendor abseil-cpp to avoid flaky GitHub tarball download
        shell: pwsh
        run: |
          # The abseil-cpp tarball served by GitHub CDN has an unstable hash.
          # Instead of patching the .wrap file, we pre-download the tarball with
          # the exact hash the .wrap file expects and place it in Meson's download
          # cache so Meson uses the cached copy instead of hitting the network.

          cd native-module
          cargo fetch

          # Find the .wrap file to read the expected hash and URL
          $wrap = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" `
            -Recurse -Filter "abseil-cpp.wrap" | Select-Object -First 1
          if (-not $wrap) { Write-Error "abseil-cpp.wrap not found"; exit 1 }
          Write-Host "Found wrap: $($wrap.FullName)"
          $wrapContent = Get-Content $wrap.FullName -Raw
          Write-Host "Wrap content:`n$wrapContent"

          # Extract source_url and source_hash from the wrap file
          $url   = ($wrapContent | Select-String 'source_url\s*=\s*(.+)').Matches[0].Groups[1].Value.Trim()
          $hash  = ($wrapContent | Select-String 'source_hash\s*=\s*(.+)').Matches[0].Groups[1].Value.Trim()
          $fname = ($wrapContent | Select-String 'source_filename\s*=\s*(.+)').Matches[0].Groups[1].Value.Trim()
          Write-Host "URL: $url"
          Write-Host "Expected hash: $hash"
          Write-Host "Filename: $fname"

          # Download the tarball
          $outFile = Join-Path $env:TEMP $fname
          Write-Host "Downloading $url → $outFile"
          Invoke-WebRequest -Uri $url -OutFile $outFile -UseBasicParsing

          # Verify the hash matches what the wrap file expects
          $actual = (Get-FileHash $outFile -Algorithm SHA256).Hash.ToLower()
          Write-Host "Actual hash:   $actual"
          Write-Host "Expected hash: $hash"
          if ($actual -ne $hash) {
            Write-Error "Hash mismatch for $fname — expected $hash but got $actual"
            exit 1
          }
          Write-Host "Hash verified OK"

          # Place in Meson's packagecache so it is never downloaded again during build
          # Meson looks in packagecache/ relative to the subprojects directory
          $mesonCache = Join-Path (Split-Path $wrap.FullName) ".." "subprojects" "packagecache"
          New-Item -ItemType Directory -Force -Path $mesonCache | Out-Null
          Copy-Item $outFile (Join-Path $mesonCache $fname) -Force
          Write-Host "Cached to $mesonCache\$fname"

      - name: Build native module (Windows)
        run: npm run build:native

      - name: Package with electron-builder (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: release/*.exe
          if-no-files-found: error

  # ─── Linux: .AppImage + .deb ─────────────────────────────────────────────────
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system packages required by electron-builder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            rpm libarchive-tools pkg-config meson ninja-build \
            libasound-dev \
            libclang-dev clang \
            libssl-dev

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_DOWNLOAD_MODELS: "1"
        run: npm ci

      - name: Build renderer + electron
        run: |
          npm run build
          npm run build:electron

      - name: Build native module (Linux x64)
        run: npm run build:native

      - name: Package with electron-builder (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # ─── Publish: collect all artifacts → create draft GitHub Release ────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: GoDojo AI ${{ github.ref_name || inputs.tag }}
          body_path: .github/RELEASE_TEMPLATE.md
          draft: true        # set to false to auto-publish on tag push
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/mac-release/*
            artifacts/win-release/*
            artifacts/linux-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}