      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-module -> target
          key: linux

      - name: Install system packages required by electron-builder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            rpm libarchive-tools pkg-config meson ninja-build \
            libasound-dev \
            libclang-dev clang \
            libssl-dev

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_DOWNLOAD_MODELS: "1"
        run: npm ci

      - name: Write app-level runtime config
        shell: bash
        run: |
          cat > .env << EOF
          VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}
          STT_PROVIDER=${{ secrets.STT_PROVIDER }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_URL=${{ secrets.TAVILY_API_URL }}
          TAVILY_MAX_RESULTS=${{ secrets.TAVILY_MAX_RESULTS }}
          TAVILY_MAX_RETRIES=${{ secrets.TAVILY_MAX_RETRIES }}
          TAVILY_RETRY_BASE_DELAY_MS=${{ secrets.TAVILY_RETRY_BASE_DELAY_MS }}
          TAVILY_TIMEOUT_MS=${{ secrets.TAVILY_TIMEOUT_MS }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          ZOOM_CLIENT_ID=${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET=${{ secrets.ZOOM_CLIENT_SECRET }}
          EOF

      - name: Verify runtime secrets resolved (pre-build)
        shell: bash
        run: |
          echo "Checking which GitHub Actions secrets actually resolved into .env..."
          echo "(This catches secrets that are missing/blank in repo settings — separate"
          echo " from whether the file itself makes it into the packaged app.)"
          byok_missing=0
          for key in VITE_API_BASE_URL SUPABASE_URL SUPABASE_KEY DEEPGRAM_API_KEY GEMINI_API_KEY GROQ_API_KEY TAVILY_API_KEY; do
            value=$(grep "^${key}=" .env | cut -d '=' -f2-)
            if [ -z "$value" ]; then
              echo "::warning::${key} is EMPTY in the generated .env — the '${key}' secret is missing or blank in repo Settings > Secrets."
              case "$key" in
                DEEPGRAM_API_KEY|GEMINI_API_KEY|GROQ_API_KEY|TAVILY_API_KEY) byok_missing=1 ;;
              esac
            else
              echo "${key} = present (${#value} chars)"
            fi
          done
          if [ "$byok_missing" -eq 1 ]; then
            echo "::warning::One or more BYOK fallback keys (DEEPGRAM/GEMINI/GROQ/TAVILY) are missing — users who haven't set their own key in Settings will have no fallback on this build."
          fi

      - name: Install posthog-cli
        run: npm install -g @posthog/cli

      - name: Build renderer + electron
        env:
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
          POSTHOG_CLI_ENV_ID: ${{ secrets.POSTHOG_CLI_ENV_ID }}
        run: |
          npm run build:release
          npm run build:electron

      - name: Build native module (Linux x64)
        run: |
          start=$(date +%s)
          npm run build:native
          end=$(date +%s)
          echo "::notice title=Native build duration (Linux)::$((end - start))s"

      - name: Package with electron-builder (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error

  # ─── Publish: collect all artifacts → create draft GitHub Release ────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          # merge-multiple isn't needed here since artifact names are already
          # distinct (mac-release/win-release/linux-release); skipped jobs
          # simply produce no artifact directory, download-artifact tolerates that.

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Determine release completeness
        id: completeness
        shell: bash
        run: |
          # Require both the yml update-metadata file AND at least one binary
          # for every platform before we let this release go public. A skipped
          # job just means these globs match nothing, so this catches partial
          # (single-platform) runs the same way it catches real failures.
          missing=""
          [ -f artifacts/mac-release/latest-mac.yml ] || missing="$missing mac:latest-mac.yml"
          compgen -G "artifacts/mac-release/*.dmg" > /dev/null || missing="$missing mac:dmg"
          [ -f artifacts/win-release/latest.yml ] || missing="$missing win:latest.yml"
          compgen -G "artifacts/win-release/*.exe" > /dev/null || missing="$missing win:exe"
          [ -f artifacts/linux-release/latest-linux.yml ] || missing="$missing linux:latest-linux.yml"
          compgen -G "artifacts/linux-release/*.AppImage" > /dev/null || missing="$missing linux:AppImage"

          if [ -z "$missing" ]; then
            echo "All platforms present — release will be published (not draft)."
            echo "all_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Missing for full publish:$missing — release will stay as a DRAFT."
            echo "all_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render release notes with actual version
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name || inputs.tag }}"
          CLEAN_TAG="${RAW_TAG%-mac}"
          CLEAN_TAG="${CLEAN_TAG%-windows}"
          CLEAN_TAG="${CLEAN_TAG%-linux}"
          CLEAN_TAG="${CLEAN_TAG%-all}"
          VERSION="${CLEAN_TAG#v}"
          sed "s/__VERSION__/${VERSION}/g" .github/RELEASE_TEMPLATE.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: GoDojo AI ${{ github.ref_name || inputs.tag }}
          body_path: release-notes.md
          draft: ${{ steps.completeness.outputs.all_present != 'true' }}
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/mac-release/*
            artifacts/win-release/*
            artifacts/linux-release/*
          # softprops/action-gh-release silently ignores glob patterns that
          # match nothing (e.g. artifacts/win-release/* when windows was
          # skipped) — so this works unmodified for partial asset sets too
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}