name: Release — Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v2.1.0)'
        required: true
        default: 'v0.0.0-test'
      platform:
        description: 'Which OS to build (tag pushes always build all three; this only applies to manual runs)'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - mac
          - windows
          - linux
      channel:
        description: 'Release channel for a manual run. "production" needs platform=all and a plain x.y.z tag.'
        required: true
        type: choice
        default: 'test'
        options:
          - test
          - beta
          - production

# One publish at a time: two overlapping releases must not interleave R2 uploads and
# backend activation. Queued (not cancelled) so a running publish is never cut off half-way.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  # ─── Resolve WHAT to build and WHERE it may be published, from either the tag name
  # or the manual workflow_dispatch inputs. Every other job reads this job's outputs
  # instead of re-parsing the tag.
  #
  #   tag                      platform   channel      published to R2 under
  #   v1.5.0                   all        production   production/   <- the ONLY way to reach users
  #   v1.5.0-all               all        test         test/
  #   v1.5.0-mac|-windows|-linux  one     test         test/         (platform-specific test releases)
  #   v1.5.0-beta.1            all        beta         beta/
  #   manual run               dropdown   dropdown     <channel>/    (production needs platform=all + x.y.z)
  #
  # Only the production channel touches production/ in R2 and the production backend
  # metadata, so a test or beta build can never become what /download/* serves.
  # ─────────────────────────────────────────────────────────────────────
  resolve-platform:
    name: Resolve target platform & channel
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.resolve.outputs.platform }}
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SUFFIX=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"; PLATFORM="$INPUT_PLATFORM"; CHANNEL="$INPUT_CHANNEL"
          else
            TAG="$REF_NAME"
            case "$TAG" in
              *-mac)     PLATFORM="mac";     SUFFIX="mac" ;;
              *-windows) PLATFORM="windows"; SUFFIX="windows" ;;
              *-linux)   PLATFORM="linux";   SUFFIX="linux" ;;
              *-all)     PLATFORM="all";     SUFFIX="all" ;;
              *)         PLATFORM="all" ;;
            esac
            CHANNEL=""
          fi

          # Strip the platform suffix — the app's own version never includes it.
          CLEAN="${TAG%-mac}"; CLEAN="${CLEAN%-windows}"; CLEAN="${CLEAN%-linux}"; CLEAN="${CLEAN%-all}"
          VERSION="${CLEAN#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' does not contain a valid version (expected vX.Y.Z[-suffix])"; exit 1
          fi

          if [ -z "$CHANNEL" ]; then   # tag push: derive the channel from the tag
            if [[ "$VERSION" == *-* ]]; then
              if [[ "$VERSION" == *beta* ]]; then CHANNEL="beta"; else CHANNEL="test"; fi
            elif [ -n "$SUFFIX" ]; then
              CHANNEL="test"
            else
              CHANNEL="production"
            fi
          fi

          if [ "$CHANNEL" = "production" ]; then
            [ "$PLATFORM" = "all" ] || { echo "::error::production releases must build all platforms (got '$PLATFORM')"; exit 1; }
            [[ "$VERSION" != *-* ]] || { echo "::error::production releases cannot use a pre-release version ('$VERSION')"; exit 1; }
          fi

          echo "Building GoDojo $VERSION  (platform=$PLATFORM, channel=$CHANNEL, event=$EVENT, tag=$TAG)"
          {
            echo "platform=$PLATFORM"
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      # Fail in seconds, not after a 40-minute build, if the R2/backend secrets were never added.
      - name: Preflight — release secrets present
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          ADMIN_CRON_KEY: ${{ secrets.ADMIN_CRON_KEY }}
        run: |
          missing=""
          for k in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_BASE_URL API_BASE_URL ADMIN_CRON_KEY; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing (Settings > Secrets and variables > Actions; API_BASE_URL is the existing VITE_API_BASE_URL secret)"
            exit 1
          fi
          case "$R2_PUBLIC_BASE_URL" in https://*) ;; *) echo "::error::R2_PUBLIC_BASE_URL must start with https://"; exit 1 ;; esac
          echo "All release secrets present."

  # ─── macOS: .dmg + .zip for x64 and arm64 ───────────────────────────────────
  build-macos:
    name: Build macOS (x64 + arm64)
    runs-on: macos-latest
    needs: resolve-platform
    if: needs.resolve-platform.outputs.platform == 'all' || needs.resolve-platform.outputs.platform == 'mac'
    steps:
      - uses: actions/checkout@v4

      - name: Sync package.json version to the pushed tag
        shell: bash
        run: |
          # Resolved once by resolve-platform (tag suffix stripped, leading 'v' removed).
          VERSION="${{ needs.resolve-platform.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building GoDojo $VERSION for channel '${{ needs.resolve-platform.outputs.channel }}'"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # build-native.js uses rustup + napi-rs to compile the native Rust module
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-module -> target
          key: macos-universal

      - name: Install Meson & Ninja
        run: brew install meson ninja

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_DOWNLOAD_MODELS: "1"
        run: npm ci
      
      - name: Write app-level runtime config
        shell: bash
        run: |
          cat > .env << EOF
          VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          API_ENCRYPTION_KEY=${{ secrets.API_ENCRYPTION_KEY }}
          DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}
          STT_PROVIDER=${{ secrets.STT_PROVIDER }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_URL=${{ secrets.TAVILY_API_URL }}
          TAVILY_MAX_RESULTS=${{ secrets.TAVILY_MAX_RESULTS }}
          TAVILY_MAX_RETRIES=${{ secrets.TAVILY_MAX_RETRIES }}
          TAVILY_RETRY_BASE_DELAY_MS=${{ secrets.TAVILY_RETRY_BASE_DELAY_MS }}
          TAVILY_TIMEOUT_MS=${{ secrets.TAVILY_TIMEOUT_MS }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          ZOOM_CLIENT_ID=${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET=${{ secrets.ZOOM_CLIENT_SECRET }}
          EOF

      - name: Verify runtime secrets resolved (pre-build)
        shell: bash
        run: |
          echo "Checking which GitHub Actions secrets actually resolved into .env..."
          echo "(This catches secrets that are missing/blank in repo settings — separate"
          echo " from whether the file itself makes it into the packaged app.)"
          byok_missing=0
          encryption_key_missing=0
          for key in VITE_API_BASE_URL SUPABASE_URL SUPABASE_KEY API_ENCRYPTION_KEY DEEPGRAM_API_KEY GEMINI_API_KEY GROQ_API_KEY TAVILY_API_KEY; do
            value=$(grep "^${key}=" .env | cut -d '=' -f2-)
            if [ -z "$value" ]; then
              echo "::warning::${key} is EMPTY in the generated .env — the '${key}' secret is missing or blank in repo Settings > Secrets."
              case "$key" in
                DEEPGRAM_API_KEY|GEMINI_API_KEY|GROQ_API_KEY|TAVILY_API_KEY) byok_missing=1 ;;
                API_ENCRYPTION_KEY) encryption_key_missing=1 ;;
              esac
            else
              echo "${key} = present (${#value} chars)"
            fi
          done
          if [ "$encryption_key_missing" -eq 1 ]; then
            echo "::warning::API_ENCRYPTION_KEY is EMPTY — CredentialsManager cannot decrypt the backend default keys, so this build silently skips the backend fallback tier and relies only on the bundled .env keys."
          fi
          if [ "$byok_missing" -eq 1 ]; then
            echo "::warning::One or more BYOK fallback keys (DEEPGRAM/GEMINI/GROQ/TAVILY) are missing — users who haven't set their own key in Settings will have no fallback on this build."
          fi

      - name: Install posthog-cli
        run: npm install -g @posthog/cli

      - name: Build renderer + electron
        env:
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
          POSTHOG_CLI_ENV_ID: ${{ secrets.POSTHOG_CLI_ENV_ID }}
        run: |
          npm run build:release
          npm run build:electron

      - name: Build native Rust module (x64 + arm64)
        # NATIVELY_BUILD_ALL_MAC_ARCHES=1 tells build-native.js to compile both arches
        env:
          NATIVELY_BUILD_ALL_MAC_ARCHES: "1"
        run: |
          start=$(date +%s)
          npm run build:native
          end=$(date +%s)
          echo "::notice title=Native build duration (macOS)::$((end - start))s"

      - name: Package with electron-builder (macOS)
        # ad-hoc-sign.js runs automatically as afterPack hook via package.json
        # identity: null in package.json = unsigned, no CSC secrets needed
        env:
          # Baked into the packaged app's app-update.yml: this build only ever looks for updates in
          # ITS OWN channel + OS folder on R2 (a test build never sees production, and vice versa).
          UPDATE_FEED_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}/${{ needs.resolve-platform.outputs.channel }}/macos
        run: npx electron-builder --mac --publish never -c.publish.url="$UPDATE_FEED_URL"

      - name: Verify .env bundled correctly in packaged app (macOS)
        # This is the check that actually matters for the "mac production build
        # has no env fallback keys" report: it inspects the REAL .app that ships,
        # not just the repo-root .env used during the build. Distinguishes
        # "extraResources never copied the file" (packaging bug, fails the job)
        # from "file is there but a specific key is blank" (secrets config,
        # warns only — same distinction as the pre-build check above).
        shell: bash
        run: |
          APP_PATHS=()
          while IFS= read -r -d '' app_path; do
            APP_PATHS+=("$app_path")
          done < <(find release -iname "*.app" -maxdepth 4 -type d -print0)
          if [ "${#APP_PATHS[@]}" -eq 0 ]; then
            echo "::error::No .app bundles found under release/ — cannot verify bundled .env."
            exit 1
          fi
          overall_fail=0
          for APP_PATH in "${APP_PATHS[@]}"; do
            ENV_IN_APP="$APP_PATH/Contents/Resources/.env"
            echo "── Checking $APP_PATH ──"
            if [ ! -f "$ENV_IN_APP" ]; then
              echo "::error::.env was NOT bundled into $APP_PATH (missing at Contents/Resources/.env). This build will have ZERO env fallback keys — every user without their own key set in Settings will fail."
              overall_fail=1
              continue
            fi
            for key in DEEPGRAM_API_KEY GEMINI_API_KEY GROQ_API_KEY TAVILY_API_KEY; do
              value=$(grep "^${key}=" "$ENV_IN_APP" | cut -d '=' -f2-)
              if [ -z "$value" ]; then
                echo "::warning::${key} is empty inside the bundled .env at $APP_PATH — matches the pre-build check, confirms it's a secrets-config issue, not a packaging one."
              else
                echo "${key}: present in bundle (${#value} chars)"
              fi
            done
          done
          if [ "$overall_fail" -eq 1 ]; then
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  # ─── Windows: .exe installer (nsis) + portable ───────────────────────────────
  build-windows:
    name: Build Windows (x64 + ia32)
    runs-on: windows-latest
    needs: resolve-platform
    if: needs.resolve-platform.outputs.platform == 'all' || needs.resolve-platform.outputs.platform == 'windows'
    steps:
      - uses: actions/checkout@v4

      - name: Sync package.json version to the pushed tag
        shell: bash
        run: |
          # Resolved once by resolve-platform (tag suffix stripped, leading 'v' removed).
          VERSION="${{ needs.resolve-platform.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building GoDojo $VERSION for channel '${{ needs.resolve-platform.outputs.channel }}'"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-module -> target
          key: windows

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_DOWNLOAD_MODELS: "1"
        run: npm ci

      - name: Write app-level runtime config
        shell: bash
        run: |
          cat > .env << EOF
          VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          API_ENCRYPTION_KEY=${{ secrets.API_ENCRYPTION_KEY }}
          DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}
          STT_PROVIDER=${{ secrets.STT_PROVIDER }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_URL=${{ secrets.TAVILY_API_URL }}
          TAVILY_MAX_RESULTS=${{ secrets.TAVILY_MAX_RESULTS }}
          TAVILY_MAX_RETRIES=${{ secrets.TAVILY_MAX_RETRIES }}
          TAVILY_RETRY_BASE_DELAY_MS=${{ secrets.TAVILY_RETRY_BASE_DELAY_MS }}
          TAVILY_TIMEOUT_MS=${{ secrets.TAVILY_TIMEOUT_MS }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          ZOOM_CLIENT_ID=${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET=${{ secrets.ZOOM_CLIENT_SECRET }}
          EOF

      - name: Verify runtime secrets resolved (pre-build)
        shell: bash
        run: |
          echo "Checking which GitHub Actions secrets actually resolved into .env..."
          echo "(This catches secrets that are missing/blank in repo settings — separate"
          echo " from whether the file itself makes it into the packaged app.)"
          byok_missing=0
          encryption_key_missing=0
          for key in VITE_API_BASE_URL SUPABASE_URL SUPABASE_KEY API_ENCRYPTION_KEY DEEPGRAM_API_KEY GEMINI_API_KEY GROQ_API_KEY TAVILY_API_KEY; do
            value=$(grep "^${key}=" .env | cut -d '=' -f2-)
            if [ -z "$value" ]; then
              echo "::warning::${key} is EMPTY in the generated .env — the '${key}' secret is missing or blank in repo Settings > Secrets."
              case "$key" in
                DEEPGRAM_API_KEY|GEMINI_API_KEY|GROQ_API_KEY|TAVILY_API_KEY) byok_missing=1 ;;
                API_ENCRYPTION_KEY) encryption_key_missing=1 ;;
              esac
            else
              echo "${key} = present (${#value} chars)"
            fi
          done
          if [ "$encryption_key_missing" -eq 1 ]; then
            echo "::warning::API_ENCRYPTION_KEY is EMPTY — CredentialsManager cannot decrypt the backend default keys, so this build silently skips the backend fallback tier and relies only on the bundled .env keys."
          fi
          if [ "$byok_missing" -eq 1 ]; then
            echo "::warning::One or more BYOK fallback keys (DEEPGRAM/GEMINI/GROQ/TAVILY) are missing — users who haven't set their own key in Settings will have no fallback on this build."
          fi

      - name: Install posthog-cli
        run: npm install -g @posthog/cli

      - name: Build renderer + electron
        env:
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
          POSTHOG_CLI_ENV_ID: ${{ secrets.POSTHOG_CLI_ENV_ID }}
        run: |
          npm run build:release
          npm run build:electron

      - name: Build native module (Windows)
        # webrtc-audio-processing is cfg-gated to non-Windows in Cargo.toml,
        # so Meson/Ninja/abseil are never invoked here.
        shell: bash
        run: |
          start=$(date +%s)
          npm run build:native
          end=$(date +%s)
          echo "::notice title=Native build duration (Windows)::$((end - start))s"

      - name: Package with electron-builder (Windows)
        env:
          # Baked into the packaged app's app-update.yml: this build only ever looks for updates in
          # ITS OWN channel + OS folder on R2 (a test build never sees production, and vice versa).
          UPDATE_FEED_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}/${{ needs.resolve-platform.outputs.channel }}/windows
        run: npx electron-builder --win --publish never "-c.publish.url=$env:UPDATE_FEED_URL"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  # ─── Linux: .AppImage + .deb ─────────────────────────────────────────────────
  build-linux:
    name: Build Linux (x64)
    # Pinned (not ubuntu-latest): the ALSA dev package name is Ubuntu-version-
    # sensitive (libasound2-dev historically, libasound-dev on 24.04). Letting
    # this alias roll to a future release risks silently breaking apt-get install
    # again — the exact class of failure this job was just fixed for.
    runs-on: ubuntu-24.04
    needs: resolve-platform
    if: needs.resolve-platform.outputs.platform == 'all' || needs.resolve-platform.outputs.platform == 'linux'
    steps:
      - uses: actions/checkout@v4

      - name: Sync package.json version to the pushed tag
        shell: bash
        run: |
          # Resolved once by resolve-platform (tag suffix stripped, leading 'v' removed).
          VERSION="${{ needs.resolve-platform.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building GoDojo $VERSION for channel '${{ needs.resolve-platform.outputs.channel }}'"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-module -> target
          key: linux

      - name: Install system packages required by electron-builder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            rpm libarchive-tools pkg-config meson ninja-build \
            libasound-dev \
            libpulse-dev \
            libclang-dev clang \
            libssl-dev

      - name: Install dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_DOWNLOAD_MODELS: "1"
        run: npm ci

      - name: Write app-level runtime config
        shell: bash
        run: |
          cat > .env << EOF
          VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          API_ENCRYPTION_KEY=${{ secrets.API_ENCRYPTION_KEY }}
          DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}
          STT_PROVIDER=${{ secrets.STT_PROVIDER }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_URL=${{ secrets.TAVILY_API_URL }}
          TAVILY_MAX_RESULTS=${{ secrets.TAVILY_MAX_RESULTS }}
          TAVILY_MAX_RETRIES=${{ secrets.TAVILY_MAX_RETRIES }}
          TAVILY_RETRY_BASE_DELAY_MS=${{ secrets.TAVILY_RETRY_BASE_DELAY_MS }}
          TAVILY_TIMEOUT_MS=${{ secrets.TAVILY_TIMEOUT_MS }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          ZOOM_CLIENT_ID=${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET=${{ secrets.ZOOM_CLIENT_SECRET }}
          EOF

      - name: Verify runtime secrets resolved (pre-build)
        shell: bash
        run: |
          echo "Checking which GitHub Actions secrets actually resolved into .env..."
          echo "(This catches secrets that are missing/blank in repo settings — separate"
          echo " from whether the file itself makes it into the packaged app.)"
          byok_missing=0
          encryption_key_missing=0
          for key in VITE_API_BASE_URL SUPABASE_URL SUPABASE_KEY API_ENCRYPTION_KEY DEEPGRAM_API_KEY GEMINI_API_KEY GROQ_API_KEY TAVILY_API_KEY; do
            value=$(grep "^${key}=" .env | cut -d '=' -f2-)
            if [ -z "$value" ]; then
              echo "::warning::${key} is EMPTY in the generated .env — the '${key}' secret is missing or blank in repo Settings > Secrets."
              case "$key" in
                DEEPGRAM_API_KEY|GEMINI_API_KEY|GROQ_API_KEY|TAVILY_API_KEY) byok_missing=1 ;;
                API_ENCRYPTION_KEY) encryption_key_missing=1 ;;
              esac
            else
              echo "${key} = present (${#value} chars)"
            fi
          done
          if [ "$encryption_key_missing" -eq 1 ]; then
            echo "::warning::API_ENCRYPTION_KEY is EMPTY — CredentialsManager cannot decrypt the backend default keys, so this build silently skips the backend fallback tier and relies only on the bundled .env keys."
          fi
          if [ "$byok_missing" -eq 1 ]; then
            echo "::warning::One or more BYOK fallback keys (DEEPGRAM/GEMINI/GROQ/TAVILY) are missing — users who haven't set their own key in Settings will have no fallback on this build."
          fi

      - name: Install posthog-cli
        run: npm install -g @posthog/cli

      - name: Build renderer + electron
        env:
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
          POSTHOG_CLI_ENV_ID: ${{ secrets.POSTHOG_CLI_ENV_ID }}
        run: |
          npm run build:release
          npm run build:electron

      - name: Build native module (Linux x64)
        run: |
          start=$(date +%s)
          npm run build:native
          end=$(date +%s)
          echo "::notice title=Native build duration (Linux)::$((end - start))s"

      - name: Package with electron-builder (Linux)
        env:
          # Baked into the packaged app's app-update.yml: this build only ever looks for updates in
          # ITS OWN channel + OS folder on R2 (a test build never sees production, and vice versa).
          UPDATE_FEED_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}/${{ needs.resolve-platform.outputs.channel }}/linux
        run: npx electron-builder --linux --publish never -c.publish.url="$UPDATE_FEED_URL"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error

  # ─── Publish: validate → upload to R2 → verify → activate → notes → switch on auto-update ──
  #
  # Order matters, and every step gates the next (a failure stops the job, so the previous
  # production release stays active):
  #   1. validate artifacts (nothing uploaded yet)
  #   2. upload installers/zips/blockmaps to R2      (immutable, versioned filenames)
  #   3. verify them (size in R2 + public r2.dev URL)
  #   4. activate on the backend                     (/download/* now redirects to this release)
  #   5. create the GitHub release page (notes only) (so the notes exist BEFORE the update is visible)
  #   6. upload latest*.yml LAST and verify          (this is what the Electron updater reads)
  # Update feeds go last on purpose: electron-updater reads them straight from R2, bypassing the
  # backend, so publishing them before step 4 would let auto-update ship a release the backend
  # never activated. The release notes (step 5) go just before the feeds so the notes page already
  # exists at the moment an installed app first sees the update.
  publish:
    name: Publish to Cloudflare R2
    runs-on: ubuntu-latest
    needs: [resolve-platform, build-macos, build-windows, build-linux]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.resolve-platform.outputs.channel }}
      VERSION: ${{ needs.resolve-platform.outputs.version }}
      ARTIFACTS_DIR: artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          # Artifact names are already distinct (mac-release/win-release/linux-release);
          # skipped jobs simply produce no directory, download-artifact tolerates that.

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Check release completeness for this channel
        shell: bash
        run: |
          echo "Release: GoDojo $VERSION -> channel '$CHANNEL'"
          if [ "$CHANNEL" = "production" ]; then
            # Production must ship BOTH desktop platforms (Linux rides along when it was built).
            missing=""
            [ -f artifacts/mac-release/latest-mac.yml ] || missing="$missing mac:latest-mac.yml"
            [ -f "artifacts/mac-release/GoDojo.AI-${VERSION}-arm64.dmg" ] || missing="$missing mac:arm64.dmg"
            [ -f "artifacts/mac-release/GoDojo.AI-${VERSION}-x64.dmg" ] || missing="$missing mac:x64.dmg"
            [ -f artifacts/win-release/latest.yml ] || missing="$missing win:latest.yml"
            compgen -G "artifacts/win-release/*Setup*.exe" > /dev/null || missing="$missing win:setup.exe"
            if [ -n "$missing" ]; then
              echo "::error::Refusing to publish to production — missing:$missing"
              exit 1
            fi
          else
            find artifacts -name 'latest*.yml' | grep -q . || { echo "::error::No build produced an update manifest"; exit 1; }
          fi
          echo "Artifact set is complete for '$CHANNEL'."

      - name: Verify update-metadata filenames match actual binaries
        # Catches the class of bug that broke v1.0.1's Windows auto-update:
        # electron-builder writes latest*.yml with the LOCAL artifact
        # filename, and the updater requests exactly that name from the feed.
        # If artifactName ever drifts from what is actually uploaded (spaces,
        # renamed files), the updater fetches a URL that 404s. This fails the
        # job BEFORE anything is uploaded to R2 instead of letting a broken
        # update ship.
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          check_yml() {
            local yml_path="$1"
            local artifacts_dir="$2"
            [ -f "$yml_path" ] || { echo "  (skipping, not present: $yml_path)"; return; }

            echo "── Checking $yml_path against $artifacts_dir ──"
            # Pull every filename referenced via top-level `path:` and each
            # `files[].url:` entry. electron-builder's yml is flat/simple
            # enough that this doesn't need a real YAML parser.
            local names
            names=$(grep -E '^\s*(path|url):\s' "$yml_path" | sed -E 's/^\s*(path|url):\s*//; s/\s*$//' | sort -u)

            if [ -z "$names" ]; then
              echo "::error::No path/url entries found in $yml_path — cannot verify."
              fail=1
              return
            fi

            while IFS= read -r name; do
              if [ ! -f "$artifacts_dir/$name" ]; then
                echo "::error::$yml_path references '$name' but no such file exists in $artifacts_dir. Uploaded asset names will not match what the auto-updater requests — this is the exact bug that broke Windows auto-update on v1.0.1."
                fail=1
              else
                echo "  OK: $name"
              fi
            done <<< "$names"
          }

          check_yml "artifacts/mac-release/latest-mac.yml"   "artifacts/mac-release"
          check_yml "artifacts/win-release/latest.yml"       "artifacts/win-release"
          check_yml "artifacts/linux-release/latest-linux.yml" "artifacts/linux-release"

          if [ "$fail" -eq 1 ]; then
            echo "::error::Update-metadata / binary filename mismatch detected — aborting before anything is uploaded to R2."
            exit 1
          fi
          echo "All update-metadata filenames match their binaries."

      - name: Upload installers to R2 and verify
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          bash .github/scripts/r2-release.sh upload-binaries
          bash .github/scripts/r2-release.sh verify-binaries
          echo "R2 upload verification complete"

      - name: Activate release on the backend
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          ADMIN_CRON_KEY: ${{ secrets.ADMIN_CRON_KEY }}
        run: bash .github/scripts/r2-release.sh activate

      # Release NOTES only — no binaries are attached. Created BEFORE the update feeds go live so
      # the notes page already exists when the first app sees the update (the app fetches notes
      # the moment it announces one). Non-critical: a failure here must not stop the release, so
      # the feeds still publish afterwards. Skipped for manual runs (no real tag).
      - name: Render release notes with actual version
        if: github.event_name == 'push'
        shell: bash
        run: sed "s/__VERSION__/${VERSION}/g" .github/RELEASE_TEMPLATE.md > release-notes.md

      - name: Create GitHub release (notes only)
        if: github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GoDojo AI ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          # Test/beta notes are flagged pre-release, which the app's announce-gate also honors.
          prerelease: ${{ needs.resolve-platform.outputs.channel != 'production' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish auto-update feeds (latest*.yml) and verify
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          bash .github/scripts/r2-release.sh upload-manifests
          bash .github/scripts/r2-release.sh verify-manifests
          echo "Release $VERSION activated on channel '$CHANNEL'"

      - name: Summary
        shell: bash
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          {
            echo "### GoDojo $VERSION — channel \`$CHANNEL\`"
            echo "- Windows feed: \`${R2_PUBLIC_BASE_URL%/}/$CHANNEL/windows/latest.yml\`"
            echo "- macOS feed: \`${R2_PUBLIC_BASE_URL%/}/$CHANNEL/macos/latest-mac.yml\`"
            [ "$CHANNEL" = "production" ] && echo "- Stable download endpoints: \`/download/windows\`, \`/download/macos\`"
            echo "- Roll back with the **Rollback release** workflow (no rebuild)."
          } >> "$GITHUB_STEP_SUMMARY"