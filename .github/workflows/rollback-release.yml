name: Rollback release

# Point production (or another channel) back at an already-published version WITHOUT rebuilding:
#   1. the backend's active pointer  -> /download/windows|macos redirect to that version again
#   2. the archived latest*.yml      -> the Electron auto-updater's feed offers that version again
# Installers in R2 are never touched or deleted. Only versions that were published by the
# release workflow can be restored (it archives each feed under <channel>/<os>/archive/<version>/).
#
# Two ways to trigger it:
#   A) push a rollback tag (same idea as the platform-specific release tags):
#
#        tag                              channel      platforms
#        rollback-v1.5.0                  production   windows macos
#        rollback-v1.5.0-windows          production   windows only
#        rollback-v1.5.0-mac              production   macos only
#        rollback-v1.5.0-linux            production   linux only
#        rollback-v1.5.0-all              production   windows macos linux
#        rollback-test-v1.5.0[-<os>]      test         (same suffixes as above)
#        rollback-beta-v1.6.0-beta.1[-<os>]  beta      (same suffixes as above)
#
#      The tag name starts with "rollback-" (not "v") on purpose: release.yml builds on v*.*.*,
#      so a rollback tag can never start a build. Create the tag on the latest commit of the
#      default branch, and to re-run the same rollback delete the old tag first.
#   B) Actions -> Rollback release -> Run workflow (manual form below).
#
# Note: electron-updater never downgrades an installed app. Rollback stops NEW users and
# not-yet-updated users from getting the bad version; anyone already on it needs a fixed
# release with a HIGHER version number.

on:
  push:
    tags:
      - 'rollback-v*'
      - 'rollback-test-v*'
      - 'rollback-beta-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to make active again (e.g. 1.5.0 — no leading v)'
        required: true
      channel:
        description: 'Channel to roll back'
        required: true
        type: choice
        default: 'production'
        options:
          - production
          - beta
          - test
      platforms:
        description: 'Platforms to roll back (space separated: windows macos)'
        required: true
        default: 'windows macos'

concurrency:
  group: release-publish   # never overlap with a publish
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works out WHAT to roll back from either the pushed tag name or the manual inputs, and
      # validates it. Every later step reads this step's outputs instead of re-parsing anything.
      - name: Resolve and validate rollback target
        id: target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"; CHANNEL="$INPUT_CHANNEL"; PLATFORMS="$INPUT_PLATFORMS"
            TRIGGER="manual run"
          else
            TAG="$REF_NAME"; TRIGGER="tag $TAG"
            REST="${TAG#rollback-}"
            case "$REST" in
              test-v*) CHANNEL="test";       REST="${REST#test-}" ;;
              beta-v*) CHANNEL="beta";       REST="${REST#beta-}" ;;
              v*)      CHANNEL="production" ;;
              *) echo "::error::'$TAG' is not a rollback tag (expected rollback-vX.Y.Z[-windows|-mac|-linux|-all], rollback-test-v… or rollback-beta-v…)"; exit 1 ;;
            esac
            case "$REST" in
              *-windows) PLATFORMS="windows";             REST="${REST%-windows}" ;;
              *-macos)   PLATFORMS="macos";               REST="${REST%-macos}" ;;
              *-mac)     PLATFORMS="macos";               REST="${REST%-mac}" ;;
              *-linux)   PLATFORMS="linux";               REST="${REST%-linux}" ;;
              *-all)     PLATFORMS="windows macos linux"; REST="${REST%-all}" ;;
              *)         PLATFORMS="windows macos" ;;
            esac
            VERSION="${REST#v}"
          fi

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not a valid version (use 1.5.0, no leading v)"; exit 1; }
          case "$CHANNEL" in production|beta|test) ;; *) echo "::error::unknown channel '$CHANNEL'"; exit 1 ;; esac
          # Same rule as release.yml: production only ever carries plain x.y.z. This also catches a
          # mistyped platform suffix (rollback-v1.5.0-widnows would otherwise parse as a pre-release).
          if [ "$CHANNEL" = "production" ] && [[ "$VERSION" == *-* ]]; then
            echo "::error::production versions are plain x.y.z, got '$VERSION' (mistyped platform suffix? use -windows, -mac, -linux or -all)"; exit 1
          fi
          NORM=""
          for p in $PLATFORMS; do
            [ "$p" = "mac" ] && p="macos"
            case "$p" in windows|macos|linux) ;; *) echo "::error::unknown platform '$p'"; exit 1 ;; esac
            NORM="$NORM $p"
          done
          PLATFORMS="${NORM# }"
          [ -n "$PLATFORMS" ] || { echo "::error::no platforms given"; exit 1; }

          echo "Rolling back channel=$CHANNEL platforms='$PLATFORMS' to version $VERSION ($TRIGGER)"
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "platforms=$PLATFORMS"
            echo "trigger=$TRIGGER"
          } >> "$GITHUB_OUTPUT"

      - name: Roll back backend pointer and update feeds
        shell: bash
        env:
          CHANNEL: ${{ steps.target.outputs.channel }}
          VERSION: ${{ steps.target.outputs.version }}
          PLATFORMS: ${{ steps.target.outputs.platforms }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          ADMIN_CRON_KEY: ${{ secrets.ADMIN_CRON_KEY }}
        run: bash .github/scripts/r2-release.sh rollback

      - name: Summary
        shell: bash
        env:
          CHANNEL: ${{ steps.target.outputs.channel }}
          VERSION: ${{ steps.target.outputs.version }}
          PLATFORMS: ${{ steps.target.outputs.platforms }}
          TRIGGER: ${{ steps.target.outputs.trigger }}
        run: |
          echo "### Rolled back \`$CHANNEL\` ($PLATFORMS) to $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: $TRIGGER" >> "$GITHUB_STEP_SUMMARY"